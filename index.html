<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrategias Seguras para Apostar</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    // Módulos con submódulos desplegables
    const modules = [
      {
        title: "Introducción Profesional",
        content: [
          {
            title: "Bienvenida",
            details: [
              "Bienvenido a esta guía avanzada de apuestas de fútbol.",
              "Este curso ha sido diseñado para enseñarte cómo analizar partidos, jugadores y estadísticas con métodos profesionales, reducir riesgos y aumentar la probabilidad de éxito en tus pronósticos."
            ]
          },
          {
            title: "Objetivos",
            details: [
              "Evaluar partidos desde múltiples perspectivas: resultados, goles, jugadores y estadísticas.",
              "Interpretar datos clave: tiros a puerta, córners, posesión, tarjetas y más.",
              "Aplicar estrategias confiables en mercados comunes y especiales.",
              "Construir apuestas combinadas y en vivo de manera profesional.",
              "Este curso es útil tanto para principiantes como para profesionales."
            ]
          }
        ]
      },
      {
        title: "Módulo 1: Tiempo y Resultado",
        content: [
          {
            title: "Resultado exacto",
            details: [
              "Revisar goles promedio de ambos equipos y enfrentamientos directos",
              "Analizar tendencia a marcar goles altos o bajos",
              "Considerar localía y motivación del partido"
            ]
          },
          {
            title: "Resultado al descanso / final",
            details: [
              "Revisar qué equipo suele marcar primero",
              "Evaluar remontadas frecuentes en la segunda mitad"
            ]
          },
          {
            title: "Ambos equipos marcan (BTTS)",
            details: [
              "Solo apostar si ambos anotan regularmente",
              "Revisar defensa débil del rival y consistencia ofensiva del equipo"
            ]
          },
          {
            title: "Más/Menos de X goles",
            details: [
              "Revisar promedio de goles combinados",
              "Ajustar por lesiones de delanteros clave o defensas ausentes"
            ]
          },
          {
            title: "Hándicap asiático",
            details: [
              "Analizar diferencia de nivel entre equipos",
              "Revisar historial de resultados con hándicap similar"
            ]
          },
          {
            title: "Hándicap europeo",
            details: [
              "Considerar posibilidad de empate",
              "Revisar forma reciente y desempeño contra rivales de nivel similar"
            ]
          },
          {
            title: "Doble oportunidad",
            details: [
              "Útil en partidos impredecibles",
              "Revisar consistencia defensiva del favorito"
            ]
          },
          {
            title: "Empate no apuesta",
            details: [
              "Proteger la apuesta si el favorito suele empatar o sufrir goles",
              "Revisar racha de victorias ajustadas y goles recibidos"
            ]
          },
          {
            title: "Primer / Último gol",
            details: [
              "Revisar qué jugador suele marcar primero y juega los 90 min",
              "Último gol → analizar capacidad de remontada del equipo"
            ]
          }
        ]
      }
    ];

    function Module({ title, content }) {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 mb-4 transition-all">
          <button onClick={() => setOpen(!open)} className="w-full text-left text-xl font-bold flex justify-between items-center">
            {title}
            <span>{open ? "−" : "+"}</span>
          </button>
          {open && (
            <div className="mt-3 space-y-3">
              {content.map((sub, index) => (
                <div key={index}>
                  <h3 className="font-semibold text-lg">{sub.title}</h3>
                  <ul className="list-disc ml-5 space-y-1">
                    {sub.details.map((d, i) => (
                      <li key={i}>{d}</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function App() {
      return (
        <div className="max-w-3xl mx-auto p-6">
          <h1 className="text-3xl font-bold text-center mb-8">⚽ Estrategias Seguras para Apostar</h1>
          {modules.map((mod, i) => (
            <Module key={i} title={mod.title} content={mod.content} />
          ))}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
