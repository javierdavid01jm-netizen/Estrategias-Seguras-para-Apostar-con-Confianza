<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estrategias Seguras para Apostar con Confianza</title>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .module-button {
        @apply w-full text-left px-5 py-3 font-semibold text-white rounded-xl shadow-md transition duration-300;
        background-color: #007bff;
      }
      .module-button:hover {
        background-color: #0065d4;
      }
      .sub-button {
        @apply w-full text-left px-4 py-2 font-medium rounded-lg mt-2;
        background-color: #e8f0ff;
      }
      .details-box {
        @apply mt-2 bg-white dark:bg-gray-800 p-3 rounded-lg shadow-inner text-gray-800 dark:text-gray-200 text-sm;
      }
      .fade {
        transition: all 0.3s ease-in-out;
      }
    </style>
  </head>

  <body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen p-4 sm:p-8"
  >
    <div id="root"></div>

    <script type="text/babel">
      const Module = ({ title, content }) => {
        const [open, setOpen] = React.useState(false);
        return (
          <div className="mb-4">
            <button
              className="module-button"
              onClick={() => setOpen(!open)}
            >
              {open ? "▼ " : "► "} {title}
            </button>
            {open && (
              <div className="fade mt-2 ml-4">
                {content.map((sub, i) => (
                  <SubModule key={i} {...sub} />
                ))}
              </div>
            )}
          </div>
        );
      };

      const SubModule = ({ title, details }) => {
        const [open, setOpen] = React.useState(false);
        return (
          <div className="mb-2">
            <button
              className="sub-button"
              onClick={() => setOpen(!open)}
            >
              {open ? "▼ " : "► "} {title}
            </button>
            {open && (
              <ul className="details-box list-disc ml-6">
                {details.map((d, i) => (
                  <li key={i}>{d}</li>
                ))}
              </ul>
            )}
          </div>
        );
      };

      const modules = [
        {
          title: "Introducción Profesional",
          content: [
            {
              title: "Bienvenida",
              details: [
                "Bienvenido a esta guía avanzada de apuestas de fútbol.",
                "Este curso ha sido diseñado para enseñarte cómo analizar partidos, jugadores y estadísticas con métodos profesionales, reducir riesgos y aumentar la probabilidad de éxito en tus pronósticos."
              ]
            },
            {
              title: "Objetivos",
              details: [
                "Evaluar partidos desde múltiples perspectivas: resultados, goles, jugadores y estadísticas.",
                "Interpretar datos clave: tiros a puerta, córners, posesión, tarjetas y más.",
                "Aplicar estrategias confiables en mercados comunes y especiales.",
                "Construir apuestas combinadas y en vivo de manera profesional.",
                "Este curso es útil tanto para principiantes como para profesionales."
              ]
            }
          ]
        },
        {
          title: "🧭 Guía Profesional: Manejo del Stake del 1 al 100",
          content: [
            {
              title: "¿Qué es el Stake 1–100?",
              details: [
                "El stake 1–100 representa el nivel de confianza en un pronóstico deportivo.",
                "Cuanto mayor sea el número, mayor es tu nivel de confianza en el análisis, no tu inversión económica."
              ]
            },
            {
              title: "Ventajas del sistema 1–100",
              details: [
                "Permite ajustes más precisos entre niveles (ej. stake 52 vs 58).",
                "Refleja con mayor fidelidad la confianza de un analista profesional.",
                "Se integra fácilmente en modelos automáticos de análisis o value.",
                "Es el estándar actual entre tipsters avanzados."
              ]
            },
            {
              title: "Escala práctica de referencia",
              details: [
                "1–20 → Muy baja confianza (pick experimental o con cuota alta).",
                "21–40 → Baja confianza (hay valor, pero con incertidumbre).",
                "41–60 → Media confianza (análisis sólido, riesgo moderado).",
                "61–80 → Alta confianza (buen value, datos firmes).",
                "81–100 → Máxima confianza (respaldo estadístico y value alto)."
              ]
            },
            {
              title: "Cómo asignar el stake de forma objetiva",
              details: [
                "Usa 4 criterios medibles, cada uno vale 25 puntos: Value, Forma/Racha, Contexto/Motivación, Datos/Estadísticas.",
                "Ejemplo: 15 + 20 + 18 + 22 = 75 → Stake 75 (Alta confianza)."
              ]
            },
            {
              title: "Reglas clave del manejo del stake",
              details: [
                "Define tu escala una sola vez y no la modifiques según emociones.",
                "Usa el stake como lenguaje de confianza, no de dinero.",
                "No uses stake 100 salvo casos con respaldo excepcional.",
                "Evalúa resultados por rangos, no solo pick por pick."
              ]
            },
            {
              title: "Enfoque moderno: No arriesgar tanto y ser rentable",
              details: [
                "El éxito no proviene de apostar fuerte, sino con criterio.",
                "Stake moderado (10–20 sobre 100) es clave para rentabilidad constante.",
                "El mejor tipster no es el que más gana en un día, sino el que sigue ganando año tras año."
              ]
            }
          ]
        },
        {
          title: "Módulo 1: Tiempo y Resultado",
          content: [
            {
              title: "Resultado exacto",
              details: [
                "Revisar goles promedio y enfrentamientos directos.",
                "Analizar tendencia a marcar goles altos o bajos.",
                "Considerar localía y motivación del partido."
              ]
            },
            {
              title: "Ambos equipos marcan (BTTS)",
              details: [
                "Apostar solo si ambos anotan regularmente.",
                "Revisar defensa débil del rival."
              ]
            },
            {
              title: "Más/Menos de X goles",
              details: [
                "Revisar promedio combinado de goles.",
                "Ajustar por lesiones de delanteros clave o defensas ausentes."
              ]
            },
            {
              title: "Hándicap asiático",
              details: [
                "Analizar diferencia de nivel entre equipos.",
                "Revisar historial con hándicap similar."
              ]
            },
            {
              title: "Doble oportunidad",
              details: [
                "Útil en partidos impredecibles.",
                "Revisar consistencia defensiva del favorito."
              ]
            }
          ]
        },
        {
          title: "Módulo 2: Goles y Jugadores",
          content: [
            {
              title: "Goles de jugador específico",
              details: [
                "Revisar si juega los 90 min regularmente.",
                "Priorizar delanteros titulares y su forma."
              ]
            },
            {
              title: "Asistencias de jugador",
              details: [
                "Identificar jugadores que generan oportunidades.",
                "Revisar participación en jugadas clave."
              ]
            },
            {
              title: "Tarjetas de jugador",
              details: [
                "Revisar historial disciplinario y tipo de partido.",
                "Partidos tensos → mayor probabilidad de amarillas."
              ]
            }
          ]
        },
        {
          title: "Módulo 3: Estadísticas del Partido",
          content: [
            {
              title: "Tiros a puerta",
              details: [
                "Revisar promedio de tiros del equipo.",
                "Ajustar según defensa del rival."
              ]
            },
            {
              title: "Tiros de esquina / Córners",
              details: [
                "Revisar promedio histórico de córners.",
                "Revisar ataques por banda y lanzadores."
              ]
            },
            {
              title: "Tarjetas y Faltas",
              details: [
                "Revisar estilo de juego y árbitro.",
                "Partidos tensos → más probabilidad de tarjetas."
              ]
            }
          ]
        },
        {
          title: "Módulo 4: Apuestas Especiales y Combinadas",
          content: [
            {
              title: "Apuestas combinadas / Bet Builder",
              details: [
                "Combinar solo mercados con alta probabilidad.",
                "Evitar mezclar apuestas arriesgadas con seguras."
              ]
            },
            {
              title: "Apuestas en vivo / Cash-out",
              details: [
                "Ajustar según estadísticas en tiempo real.",
                "Reducir riesgo aprovechando momentos clave."
              ]
            }
          ]
        },
        {
          title: "Módulo 5: Tips Profesionales Finales",
          content: [
            {
              title: "Consejos clave",
              details: [
                "Prioriza jugadores titulares que juegan 90 minutos.",
                "Evalúa tendencia histórica contra rivales similares.",
                "Ajusta pronósticos según lesiones, clima y motivación.",
                "Usa estadísticas avanzadas (xG, tiros, córners).",
                "Protege apuestas con hándicap o doble oportunidad."
              ]
            }
          ]
        }
      ];

      const App = () => (
        <div className="max-w-4xl mx-auto">
          <h1 className="text-3xl font-bold text-center mb-6 text-blue-600">
            ⚽ Estrategias Seguras para Apostar con Confianza
          </h1>
          <p className="text-center mb-8 text-gray-600">
            Curso Profesional de Pronósticos de Fútbol
          </p>
          {modules.map((m, i) => (
            <Module key={i} {...m} />
          ))}
        </div>
      );

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
